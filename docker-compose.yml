services:

  postgres:
    image: postgres:16
    container_name: leadflow_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  n8n:
    image: n8nio/n8n:latest
    container_name: leadflow_n8n
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n


  api:
    build: ./backend
    container_name: leadflow_api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${API_PORT}:8000"

    depends_on:
      - postgres
      - n8n

    volumes:
      - ./backend:/app


volumes:
  postgres_data:
  n8n_data: